<VirtualHost *:80>
    ServerName midterm.local
    ServerAlias www.midterm.local
    DocumentRoot "C:/xampp/htdocs/MidTerm230100575/public"
    
    <Directory "C:/xampp/htdocs/MidTerm230100575/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Error and Access logs (optional)
    ErrorLog "logs/midterm.local-error.log"
    CustomLog "logs/midterm.local-access.log" common
</VirtualHost>

